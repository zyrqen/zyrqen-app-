<!DOCTYPE html>
<html lang="ru">
<head>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ZYRQEN</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;
      background:
        radial-gradient(circle at 50% 0%, #182044 0%, #080a12 38%, #05060a 100%);
      color: #ffffff;
      font-family: Arial, sans-serif;
      overflow-x: hidden;
    }

    .app {
      max-width: 520px;
      min-height: 100vh;
      margin: auto;
      padding: 30px 18px 25px;
    }

    .header {
      text-align: center;
      padding-top: 20px;
      margin-bottom: 28px;
    }

    .logo {
      font-size: 42px;
      font-weight: 900;
      letter-spacing: 7px;
      text-shadow:
        0 0 10px rgba(120, 140, 255, .8),
        0 0 30px rgba(100, 80, 255, .4);
    }

    .slogan {
      margin-top: 8px;
      color: #8e96b5;
      font-size: 12px;
      letter-spacing: 3px;
      text-transform: uppercase;
    }

    .balance {
      margin: 25px 0;
      padding: 20px;
      border: 1px solid rgba(130, 140, 255, .18);
      border-radius: 20px;
      background: rgba(255,255,255,.035);
      backdrop-filter: blur(15px);
      text-align: center;
      box-shadow: 0 15px 40px rgba(0,0,0,.25);
    }

    .balance-title {
      color: #858ca7;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 7px;
    }

    .coins {
      font-size: 30px;
      font-weight: 800;
    }

    .coin {
      font-size: 25px;
    }

    .menu {
      display: grid;
      gap: 13px;
    }

    .button {
      width: 100%;
      border: 1px solid rgba(150,160,255,.16);
      border-radius: 18px;
      padding: 19px;
      color: white;
      background: linear-gradient(
        135deg,
        rgba(255,255,255,.07),
        rgba(255,255,255,.025)
      );
      font-size: 16px;
      font-weight: 700;
      text-align: left;
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
      transition: .15s;
    }

    .button:active {
      transform: scale(.97);
      background: rgba(110,120,255,.15);
    }

    .icon {
      width: 42px;
      height: 42px;
      border-radius: 13px;
      display: flex;
      align-items: center;
      justify-content: center;
      background: rgba(120,130,255,.12);
      font-size: 21px;
    }

    .arrow {
      margin-left: auto;
      color: #747c9d;
      font-size: 20px;
    }

    .daily {
      margin-top: 20px;
      padding: 18px;
      border-radius: 18px;
      background: linear-gradient(
        135deg,
        rgba(110,90,255,.18),
        rgba(60,80,180,.08)
      );
      border: 1px solid rgba(130,120,255,.25);
      display: flex;
      align-items: center;
      gap: 14px;
      cursor: pointer;
    }

    .daily-text {
      flex: 1;
    }

    .daily-title {
      font-weight: 800;
      margin-bottom: 4px;
    }

    .daily-sub {
      color: #8b92ad;
      font-size: 12px;
    }

    .footer {
      text-align: center;
      margin-top: 35px;
      color: #454b63;
      font-size: 10px;
      letter-spacing: 2px;
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 25px;
      transform: translateX(-50%) translateY(100px);
      background: #171b2a;
      border: 1px solid #303750;
      border-radius: 14px;
      padding: 13px 20px;
      color: white;
      font-size: 13px;
      transition: .3s;
      z-index: 10;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
    }
  </style>
</head>

<body>

  <div class="app">

    <header class="header">
      <div class="logo">ZYRQEN</div>
<div class="slogan">Enter Your World.</div>
</header>

<div class="balance">
  <div class="balance-title">YOUR BALANCE</div>
  <div class="coins"><span id="coins">0</span> <span class="coin">COINS</span></div>
</div>

<div class="menu">

  <button class="button" onclick="openProfile()">
    <div class="icon">🎮</div>
    <div>Games</div>
    <div class="arrow">›</div>
  </button>

  <button class="button" onclick="soon('Gifts')">
    <div class="icon">🎁</div>
    <div>Gifts</div>
    <div class="arrow">›</div>
  </button>

  <button class="button" onclick="soon('Cases')">
    <div class="icon">📦</div>
    <div>Cases</div>
    <div class="arrow">›</div>
  </button>

  <button class="button" onclick="soon('Profile')">
    <div class="icon">👤</div>
    <div>Profile</div>
    <div class="arrow">›</div>
  </button>

</div>

<div class="daily" onclick="dailyBonus()">
  <div class="icon">⚡</div>
  <div class="daily-text">
    <div class="daily-title">Daily Bonus</div>
    <div class="daily-sub">Claim +100 COINS</div>
  </div>
  <div class="arrow">›</div>
</div>

<div class="footer">
  ZYRQEN • ENTER YOUR WORLD
</div>

</div>

<div id="toast" class="toast"></div>

<script>
  const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

const user = tg.initDataUnsafe?.user;

if (user) {
    console.log("ZYRQEN user:", user);

    const username = user.username
        ? "@" + user.username
        : user.first_name;

    console.log("Пользователь:", username);
}
let coins = Number(localStorage.getItem("zyrqen_coins") || 0);
let lastBonus = localStorage.getItem("zyrqen_bonus");

function updateCoins() {
  document.getElementById("coins").textContent = coins;
}

function dailyBonus() {
  const today = new Date().toDateString();

  if (lastBonus === today) {
    showToast("Daily Bonus уже получен");
    return;
  }

  coins += 100;
  lastBonus = today;

  localStorage.setItem("zyrqen_coins", coins);
  localStorage.setItem("zyrqen_bonus", lastBonus);

  updateCoins();
  showToast("+100 COINS ⚡");
}

function soon(name) {
  showToast(name + " — скоро будет доступно");
}

function showToast(text) {
  const toast = document.getElementById("toast");
  toast.textContent = text;
  toast.classList.add("show");

  setTimeout(() => {
    toast.classList.remove("show");
  }, 2000);
}

updateCoins();
  function openProfile() {
    const user = window.Telegram?.WebApp?.initDataUnsafe?.user;

    if (!user) {
        showToast("Открой ZYRQEN через Telegram");
        return;
    }

    const username = user.username
        ? "@" + user.username
        : "Без username";

    const name = [user.first_name, user.last_name]
        .filter(Boolean)
        .join(" ");

    alert(
        "ZYRQEN PROFILE\n\n" +
        "👤 " + name + "\n" +
        "🔹 " + username + "\n" +
        "🆔 ID: " + user.id
    );
  }
</script>

</body>
</html>
