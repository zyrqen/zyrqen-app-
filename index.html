<!DOCTYPE html>
<html lang="ru">

<head>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>ZYRQEN</title>

  <style>

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      min-height: 100vh;

      background:
        radial-gradient(
          circle at 50% 0%,
          #182044 0%,
          #080a12 38%,
          #05060a 100%
        );

      color: #ffffff;

      font-family: Arial, sans-serif;

      overflow-x: hidden;
    }


    /* =========================
       APP
    ========================= */

    .app {
      max-width: 520px;
      min-height: 100vh;

      margin: auto;

      padding: 30px 18px 25px;
    }


    /* =========================
       HEADER
    ========================= */

    .header {
      text-align: center;

      padding-top: 20px;

      margin-bottom: 28px;
    }

    .logo {
      font-size: 42px;

      font-weight: 900;

      letter-spacing: 7px;

      text-shadow:
        0 0 10px rgba(120, 140, 255, .8),
        0 0 30px rgba(100, 80, 255, .4);
    }

    .slogan {
      margin-top: 8px;

      color: #8e96b5;

      font-size: 12px;

      letter-spacing: 3px;

      text-transform: uppercase;
    }


    /* =========================
       BALANCE
    ========================= */

    .balance {
      margin: 25px 0;

      padding: 20px;

      border: 1px solid rgba(130, 140, 255, .18);

      border-radius: 20px;

      background: rgba(255,255,255,.035);

      backdrop-filter: blur(15px);

      text-align: center;

      box-shadow:
        0 15px 40px rgba(0,0,0,.25);
    }

    .balance-title {
      color: #858ca7;

      font-size: 12px;

      text-transform: uppercase;

      letter-spacing: 2px;

      margin-bottom: 7px;
    }

    .coins {
      font-size: 30px;

      font-weight: 800;
    }

    .coin {
      font-size: 25px;
    }


    /* =========================
       MENU
    ========================= */

    .menu {
      display: grid;

      gap: 13px;
    }

    .button {
      width: 100%;

      border: 1px solid rgba(150,160,255,.16);

      border-radius: 18px;

      padding: 19px;

      color: white;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,.07),
          rgba(255,255,255,.025)
        );

      font-size: 16px;

      font-weight: 700;

      text-align: left;

      display: flex;

      align-items: center;

      gap: 14px;

      cursor: pointer;

      transition: .15s;
    }

    .button:active {
      transform: scale(.97);

      background:
        rgba(110,120,255,.15);
    }


    /* =========================
       ICON
    ========================= */

    .icon {
      width: 42px;

      height: 42px;

      border-radius: 13px;

      display: flex;

      align-items: center;

      justify-content: center;

      background:
        rgba(120,130,255,.12);

      font-size: 21px;

      flex-shrink: 0;
    }


    /* =========================
       ARROW
    ========================= */

    .arrow {
      margin-left: auto;

      color: #747c9d;

      font-size: 20px;
    }


    /* =========================
       DAILY BONUS
    ========================= */

    .daily {
      margin-top: 20px;

      padding: 18px;

      border-radius: 18px;

      background:
        linear-gradient(
          135deg,
          rgba(110,90,255,.18),
          rgba(60,80,180,.08)
        );

      border:
        1px solid rgba(130,120,255,.25);

      display: flex;

      align-items: center;

      gap: 14px;

      cursor: pointer;
    }

    .daily-text {
      flex: 1;
    }

    .daily-title {
      font-weight: 800;

      margin-bottom: 4px;
    }

    .daily-sub {
      color: #8b92ad;

      font-size: 12px;
    }


    /* =========================
       FOOTER
    ========================= */

    .footer {
      text-align: center;

      margin-top: 35px;

      color: #454b63;

      font-size: 10px;

      letter-spacing: 2px;
    }


    /* =========================
       TOAST
    ========================= */

    .toast {
      position: fixed;

      left: 50%;

      bottom: 25px;

      transform:
        translateX(-50%)
        translateY(100px);

      background: #171b2a;

      border:
        1px solid #303750;

      border-radius: 14px;

      padding: 13px 20px;

      color: white;

      font-size: 13px;

      transition: .3s;

      z-index: 10;
    }

    .toast.show {
      transform:
        translateX(-50%)
        translateY(0);
    }


    /* =========================
       PROFILE
    ========================= */

    .profile-screen {
      display: none;

      min-height: 100vh;

      padding-bottom: 30px;
    }

    .profile-header {
      text-align: center;

      padding:
        20px
        0
        25px;
    }

    .profile-avatar {
      width: 90px;

      height: 90px;

      margin:
        0 auto
        14px;

      border-radius: 50%;

      overflow: hidden;

      border:
        2px solid
        rgba(130,140,255,.5);

      box-shadow:
        0 0 20px
        rgba(100,100,255,.35),

        0 0 50px
        rgba(80,70,255,.15);

      background:
        rgba(120,130,255,.12);

      display: flex;

      align-items: center;

      justify-content: center;

      font-size: 38px;

      font-weight: 900;
    }

    .profile-avatar img {
      width: 100%;

      height: 100%;

      object-fit: cover;
    }

    .profile-name {
      font-size: 23px;

      font-weight: 800;
    }

    .profile-username {
      margin-top: 5px;

      color: #858ca7;

      font-size: 13px;
    }


    /* =========================
       PROFILE CARD
    ========================= */

    .profile-card {
      margin-top: 15px;

      padding: 20px;

      border:
        1px solid
        rgba(130,140,255,.18);

      border-radius: 20px;

      background:
        rgba(255,255,255,.035);

      backdrop-filter:
        blur(15px);

      box-shadow:
        0 15px 40px
        rgba(0,0,0,.25);
    }


    /* =========================
       PROFILE BALANCE
    ========================= */

    .profile-balance {
      text-align: center;
    }

    .profile-balance-label {
      color: #858ca7;

      font-size: 11px;

      letter-spacing: 2px;
    }

    .profile-balance-value {
      margin-top: 6px;

      font-size: 32px;

      font-weight: 900;
    }


    /* =========================
       PROFILE STATS
    ========================= */

    .profile-stats {
      display: grid;

      grid-template-columns:
        repeat(3, 1fr);

      gap: 10px;

      margin-top: 15px;
    }

    .stat {
      padding: 15px 8px;

      text-align: center;

      border-radius: 15px;

      background:
        rgba(255,255,255,.035);

      border:
        1px solid
        rgba(130,140,255,.12);
    }

    .stat-value {
      font-size: 20px;

      font-weight: 800;
    }

    .stat-label {
      margin-top: 5px;

      color: #747c9d;

      font-size: 10px;
    }


    /* =========================
       PROFILE INFO
    ========================= */

    .profile-info {
      margin-top: 15px;
    }

    .info-row {
      display: flex;

      justify-content: space-between;

      padding: 13px 0;

      border-bottom:
        1px solid
        rgba(255,255,255,.06);

      font-size: 13px;

      gap: 15px;
    }

    .info-row:last-child {
      border-bottom: none;
    }

    .info-label {
      color: #747c9d;
    }


    /* =========================
       BACK BUTTON
    ========================= */

    .back-button {
      width: 100%;

      margin-top: 20px;

      padding: 16px;

      border:
        1px solid
        rgba(130,140,255,.18);

      border-radius: 16px;

      background:
        rgba(255,255,255,.04);

      color: white;

      font-size: 15px;

      font-weight: 700;

      cursor: pointer;
    }

    .back-button:active {
      transform: scale(.97);
    }

  </style>

</head>


<body>

  <div class="app">


    <!-- =========================
         MAIN SCREEN
    ========================= -->

    <div id="mainScreen">

      <header class="header">

        <div class="logo">
          ZYRQEN
        </div>

        <div class="slogan">
          Enter Your World.
        </div>

      </header>


      <!-- BALANCE -->

      <div class="balance">

        <div class="balance-title">
          YOUR BALANCE
        </div>

        <div class="coins">

          <span id="coins">
            0
          </span>

          <span class="coin">
            COINS
          </span>

        </div>

      </div>


      <!-- MENU -->

      <div class="menu">


        <!-- GAMES -->

        <button
          class="button"
          onclick="soon('Games')"
        >

          <div class="icon">
            🎮
          </div>

          <div>
            Games
          </div>

          <div class="arrow">
            ›
          </div>

        </button>


        <!-- GIFTS -->

        <button
          class="button"
          onclick="soon('Gifts')"
        >

          <div class="icon">
            🎁
          </div>

          <div>
            Gifts
          </div>

          <div class="arrow">
            ›
          </div>

        </button>


        <!-- CASES -->

        <button
          class="button"
          onclick="soon('Cases')"
        >

          <div class="icon">
            📦
          </div>

          <div>
            Cases
          </div>

          <div class="arrow">
            ›
          </div>

        </button>


        <!-- PROFILE -->

        <button
          class="button"
          onclick="openProfile()"
        >

          <div class="icon">
            👤
          </div>

          <div>
            Profile
          </div>

          <div class="arrow">
            ›
          </div>

        </button>

      </div>


      <!-- DAILY BONUS -->

      <div
        class="daily"
        onclick="dailyBonus()"
      >

        <div class="icon">
          ⚡
        </div>

        <div class="daily-text">

          <div class="daily-title">
            Daily Bonus
          </div>

          <div class="daily-sub">
            Claim +100 COINS
          </div>

        </div>

        <div class="arrow">
          ›
        </div>

      </div>


      <!-- FOOTER -->

      <div class="footer">
        ZYRQEN • ENTER YOUR WORLD
      </div>

    </div>


    <!-- =========================
         PROFILE SCREEN
    ========================= -->

    <div
      id="profileScreen"
      class="profile-screen"
    >

      <div class="profile-header">


        <!-- AVATAR -->

        <div
          id="profileAvatar"
          class="profile-avatar"
        >
          👤
        </div>


        <!-- NAME -->

        <div
          id="profileName"
          class="profile-name"
        >
          User
        </div>


        <!-- USERNAME -->

        <div
          id="profileUsername"
          class="profile-username"
        >
          @username
        </div>

      </div>


      <!-- PROFILE CARD -->

      <div class="profile-card">


        <!-- BALANCE -->

        <div class="profile-balance">

          <div class="profile-balance-label">
            YOUR BALANCE
          </div>

          <div class="profile-balance-value">

            🪙

            <span id="profileCoins">
              0
            </span>

          </div>

        </div>


        <!-- STATS -->

        <div class="profile-stats">


          <div class="stat">

            <div class="stat-value">
              0
            </div>

            <div class="stat-label">
              GAMES
            </div>

          </div>


          <div class="stat">

            <div class="stat-value">
              0
            </div>

            <div class="stat-label">
              GIFTS
            </div>

          </div>


          <div class="stat">

            <div class="stat-value">
              0
            </div>

            <div class="stat-label">
              CASES
            </div>

          </div>


        </div>


        <!-- INFORMATION -->

        <div class="profile-info">


          <div class="info-row">

            <span class="info-label">
              Telegram ID
            </span>

            <span id="profileId">
              —
            </span>

          </div>


          <div class="info-row">

            <span class="info-label">
              Status
            </span>

            <span>
              ACTIVE
            </span>

          </div>


        </div>

      </div>


      <!-- BACK -->

      <button
        class="back-button"
        onclick="closeProfile()"
      >
        ← BACK
      </button>

    </div>


  </div>


  <!-- TOAST -->

  <div
    id="toast"
    class="toast"
  ></div>


  <script>


    /* =========================
       TELEGRAM
    ========================= */

    const tg =
      window.Telegram.WebApp;

    tg.ready();

    tg.expand();


    const telegramUser =
      tg.initDataUnsafe?.user;


    if (telegramUser) {

      console.log(
        "ZYRQEN user:",
        telegramUser
      );

    }


    /* =========================
       COINS
    ========================= */

    let coins =
      Number(
        localStorage.getItem(
          "zyrqen_coins"
        ) || 0
      );


    let lastBonus =
      localStorage.getItem(
        "zyrqen_bonus"
      );


    function updateCoins() {

      document
        .getElementById("coins")
        .textContent = coins;

    }


    /* =========================
       DAILY BONUS
    ========================= */

    function dailyBonus() {

      const today =
        new Date().toDateString();


      if (lastBonus === today) {

        showToast(
          "Daily Bonus уже получен"
        );

        return;
      }


      coins += 100;

      lastBonus = today;


      localStorage.setItem(
        "zyrqen_coins",
        coins
      );


      localStorage.setItem(
        "zyrqen_bonus",
        lastBonus
      );


      updateCoins();


      showToast(
        "+100 COINS ⚡"
      );

    }


    /* =========================
       SOON
    ========================= */

    function soon(name) {

      showToast(
        name +
        " — скоро будет доступно"
      );

    }


    /* =========================
       PROFILE
    ========================= */

    function openProfile() {

      const user =
        window.Telegram
          ?.WebApp
          ?.initDataUnsafe
          ?.user;


      if (!user) {

        showToast(
          "Открой ZYRQEN через Telegram"
        );

        return;
      }


      document
        .getElementById("mainScreen")
        .style.display = "none";


      document
        .getElementById("profileScreen")
        .style.display = "block";


      /* NAME */

      const name = [
        user.first_name,
        user.last_name
      ]
        .filter(Boolean)
        .join(" ");


      document
        .getElementById("profileName")
        .textContent =
          name || "User";


      /* USERNAME */

      document
        .getElementById("profileUsername")
        .textContent =
          user.username
            ? "@" + user.username
            : "No username";


      /* TELEGRAM ID */

      document
        .getElementById("profileId")
        .textContent =
          user.id;


      /* BALANCE */

      document
        .getElementById("profileCoins")
        .textContent =
          coins;


      /* AVATAR */

      const avatar =
        document.getElementById(
          "profileAvatar"
        );


      if (user.photo_url) {

        avatar.innerHTML =
          `<img
             src="${user.photo_url}"
             alt="Avatar"
           >`;

      }

      else {

        avatar.textContent =
          (
            user.first_name ||
            "U"
          )
            .charAt(0)
            .toUpperCase();

      }

    }


    /* =========================
       CLOSE PROFILE
    ========================= */

    function closeProfile() {

      document
        .getElementById("profileScreen")
        .style.display = "none";


      document
        .getElementById("mainScreen")
        .style.display = "block";

    }


    /* =========================
       TOAST
    ========================= */

    function showToast(text) {

      const toast =
        document.getElementById(
          "toast"
        );


      toast.textContent = text;


      toast.classList.add(
        "show"
      );


      setTimeout(() => {

        toast.classList.remove(
          "show"
        );

      }, 2000);

    }


    /* =========================
       START
    ========================= */

    updateCoins();

  </script>

</body>

</html>
