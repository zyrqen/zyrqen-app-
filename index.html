<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>ZYRQEN</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>

*{
    box-sizing:border-box;
    -webkit-tap-highlight-color:transparent;
}

body{
    margin:0;
    background:#07080d;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
    min-height:100vh;
}

button{
    font-family:inherit;
}

.screen{
    min-height:100vh;
    padding:25px 18px 35px;
}

.logo{
    text-align:center;
    padding-top:15px;
    margin-bottom:7px;
}

.logo h1{
    margin:0;
    font-size:39px;
    letter-spacing:7px;
    font-weight:900;
}

.logo p{
    margin:8px 0 0;
    color:#8589a0;
    font-size:12px;
    letter-spacing:3px;
}

.balance{
    margin:28px auto 22px;
    width:100%;
    max-width:430px;
    padding:18px;
    border:1px solid #202438;
    border-radius:18px;
    background:linear-gradient(145deg,#10121b,#090a10);
    text-align:center;
}

.balance-label{
    color:#777c92;
    font-size:11px;
    letter-spacing:2px;
}

.balance-value{
    margin-top:6px;
    font-size:27px;
    font-weight:800;
}

.menu{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:13px;
    max-width:430px;
    margin:auto;
}

.button{
    min-height:72px;
    border:1px solid #252a40;
    border-radius:17px;
    background:linear-gradient(145deg,#121522,#0b0d14);
    color:white;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    transition:.15s;
}

.button:active{
    transform:scale(.96);
    border-color:#5960ff;
}

.button-icon{
    display:block;
    font-size:24px;
    margin-bottom:6px;
}

.bonus{
    max-width:430px;
    margin:18px auto 0;
    padding:18px;
    border-radius:18px;
    border:1px solid #24283a;
    background:#0d0f17;
}

.bonus-title{
    font-size:14px;
    font-weight:800;
}

.bonus-text{
    color:#85899d;
    font-size:12px;
    margin-top:5px;
}

.bonus button{
    width:100%;
    margin-top:13px;
    padding:13px;
    border:0;
    border-radius:12px;
    background:#ffffff;
    color:#07080d;
    font-weight:800;
}

/* PROFILE */

.profile-screen,
.games-screen,
.reaction-screen,
.cases-screen,
.case-open-screen{
    display:none;
}

.profile-header{
    text-align:center;
    padding-top:18px;
}

.profile-avatar{
    width:82px;
    height:82px;
    margin:auto;
    border-radius:50%;
    background:#171a27;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:34px;
    overflow:hidden;
    border:2px solid #30354f;
}

.profile-avatar img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.profile-name{
    margin-top:13px;
    font-size:20px;
    font-weight:800;
}

.profile-username{
    margin-top:5px;
    color:#777c92;
    font-size:13px;
}

.profile-card{
    max-width:430px;
    margin:25px auto;
    padding:20px;
    background:#0d0f17;
    border:1px solid #24283a;
    border-radius:20px;
}

.profile-balance{
    text-align:center;
    padding-bottom:20px;
    border-bottom:1px solid #202337;
}

.profile-balance-label{
    color:#777c92;
    font-size:10px;
    letter-spacing:2px;
}

.profile-balance-value{
    margin-top:7px;
    font-size:30px;
    font-weight:900;
}

.profile-stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    margin:20px 0;
    text-align:center;
}

.stat{
    border-right:1px solid #202337;
}

.stat:last-child{
    border-right:0;
}

.stat-value{
    font-size:21px;
    font-weight:800;
}

.stat-label{
    margin-top:5px;
    color:#777c92;
    font-size:9px;
}

.profile-info{
    border-top:1px solid #202337;
    padding-top:13px;
}

.info-row{
    display:flex;
    justify-content:space-between;
    padding:8px 0;
    font-size:12px;
}

.info-label{
    color:#777c92;
}

.back-button{
    display:block;
    width:100%;
    max-width:430px;
    margin:15px auto;
    padding:14px;
    background:#11131d;
    color:white;
    border:1px solid #272b40;
    border-radius:13px;
    font-weight:800;
}

/* GAMES */

.section-title{
    text-align:center;
    padding-top:18px;
}

.section-title h2{
    margin:0;
    font-size:28px;
    letter-spacing:3px;
}

.section-title p{
    color:#777c92;
    font-size:12px;
    margin-top:8px;
}

.game-card{
    max-width:430px;
    margin:25px auto 12px;
    padding:22px;
    border:1px solid #292e47;
    border-radius:20px;
    background:linear-gradient(145deg,#111421,#090b12);
}

.game-icon{
    font-size:40px;
}

.game-name{
    margin-top:12px;
    font-size:21px;
    font-weight:900;
    letter-spacing:1px;
}

.game-description{
    margin-top:7px;
    color:#85899d;
    font-size:12px;
    line-height:1.5;
}

.play-button{
    width:100%;
    margin-top:18px;
    padding:15px;
    border:0;
    border-radius:13px;
    background:white;
    color:#07080d;
    font-weight:900;
    font-size:14px;
}

/* REACTION */

.reaction-box{
    max-width:430px;
    margin:30px auto;
    text-align:center;
}

.reaction-status{
    color:#85899d;
    font-size:13px;
    min-height:20px;
}

.reaction-button{
    width:190px;
    height:190px;
    margin:30px auto;
    border-radius:50%;
    border:2px solid #30354d;
    background:#10131e;
    color:white;
    font-size:20px;
    font-weight:900;
}

.reaction-button.ready{
    background:#ffffff;
    color:#07080d;
    border-color:white;
}

.reward{
    font-size:17px;
    font-weight:800;
}

/* CASES */

.case-card{
    max-width:430px;
    margin:25px auto;
    padding:25px 20px;
    text-align:center;
    border:1px solid #30354c;
    border-radius:22px;
    background:
        radial-gradient(circle at top,#171b2d,#090b12 65%);
}

.case-icon{
    font-size:72px;
    margin:5px 0 12px;
}

.case-name{
    font-size:23px;
    font-weight:900;
    letter-spacing:2px;
}

.case-price{
    margin-top:8px;
    color:#85899d;
    font-size:13px;
}

.case-rewards{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:8px;
    margin-top:20px;
}

.reward-item{
    padding:11px 4px;
    border:1px solid #252a40;
    border-radius:10px;
    background:#0e1018;
    font-size:12px;
}

.case-button{
    width:100%;
    margin-top:20px;
    padding:16px;
    border:0;
    border-radius:13px;
    background:white;
    color:#07080d;
    font-size:14px;
    font-weight:900;
}

.case-count{
    margin-top:13px;
    color:#666b80;
    font-size:11px;
}

/* CASE OPENING */

.opening-area{
    max-width:430px;
    margin:45px auto 25px;
    text-align:center;
}

.opening-case{
    font-size:105px;
    transform:scale(1);
}

.opening-case.animate{
    animation:caseShake .12s infinite alternate;
}

@keyframes caseShake{
    from{transform:rotate(-5deg) scale(1);}
    to{transform:rotate(5deg) scale(1.08);}
}

.opening-text{
    margin-top:25px;
    color:#85899d;
    font-size:13px;
}

.win-reward{
    margin-top:20px;
    font-size:30px;
    font-weight:900;
}

.win-rarity{
    margin-top:7px;
    color:#85899d;
    font-size:13px;
}

.continue-button{
    display:block;
    width:100%;
    max-width:430px;
    margin:25px auto;
    padding:15px;
    border:0;
    border-radius:13px;
    background:white;
    color:#07080d;
    font-weight:900;
}

/* TOAST */

.toast{
    position:fixed;
    left:50%;
    bottom:25px;
    transform:translateX(-50%) translateY(20px);
    background:#171a25;
    border:1px solid #30354a;
    padding:12px 18px;
    border-radius:12px;
    font-size:13px;
    opacity:0;
    pointer-events:none;
    transition:.25s;
    z-index:999;
}

.toast.show{
    opacity:1;
    transform:translateX(-50%) translateY(0);
}

</style>
</head>

<body>

<!-- MAIN -->

<div id="mainScreen" class="screen">

    <div class="logo">
        <h1>ZYRQEN</h1>
        <p>ENTER YOUR WORLD</p>
    </div>

    <div class="balance">
        <div class="balance-label">YOUR BALANCE</div>
        <div class="balance-value">
            🪙 <span id="coins">0</span>
        </div>
    </div>

    <div class="menu">

        <button class="button" onclick="openGames()">
            <span class="button-icon">🎮</span>
            GAMES
        </button>

        <button class="button" onclick="soon('Gifts')">
            <span class="button-icon">🎁</span>
            GIFTS
        </button>

        <button class="button" onclick="openCases()">
            <span class="button-icon">🎲</span>
            CASES
        </button>

        <button class="button" onclick="openProfile()">
            <span class="button-icon">👤</span>
            PROFILE
        </button>

    </div>

    <div class="bonus">

        <div class="bonus-title">🎁 DAILY BONUS</div>

        <div class="bonus-text">
            Come back every day and receive free coins.
        </div>

        <button onclick="claimBonus()">
            CLAIM +100 🪙
        </button>

    </div>

</div>


<!-- PROFILE -->

<div id="profile
